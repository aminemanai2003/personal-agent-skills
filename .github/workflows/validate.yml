name: Validate

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install validation dependency
        run: python -m pip install -r requirements-dev.txt

      - name: Validate skill packages
        run: python scripts/validate_repo.py

      - name: Validate trigger scenarios
        run: python scripts/validate_evals.py

      - name: Validate showcase artifacts
        run: python scripts/validate_showcase.py

      - name: Run tests
        run: python -m unittest discover -s tests -v
